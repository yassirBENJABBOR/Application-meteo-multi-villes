
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather </title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#0B1120] p-5 font-sans text-white">

    <!-- Header -->
    <header class="mb-8 text-center">
        <h1 class="mb-2 text-3xl font-bold text-[#38BDF8]">
            Weather App ☀️
        </h1>

        <p class="text-gray-300">
            La météo de votre ville
        </p>
    </header>

    <main class="mx-auto max-w-[600px]">

        <!-- Recherche -->
        <form id="search-form" class="mb-6 flex flex-col gap-3">

            <label for="search-input" class="font-medium">
                Ville recherchée :
            </label>
            <input id="search-input"type="text"placeholder="Entrez une ville..."class="w-full rounded-lg border-2  px-3 py-3 text-black outline-none focus:border-sky-400">
            <span id="error-text"class="hidden w-full rounded-md border border-red-500 bg-white p-2 text-red-500"></span>
            <p id="loading" class="hidden text-sky-400">
                Chargement...
            </p>
            <button type="submit"class="rounded-lg bg-[#38BDF8] p-3 font-semibold text-[#0B1120] transition hover:bg-sky-400">
                Rechercher
            </button>

        </form>

        <!-- Météo actuelle -->
        <section id ="weather-card" class="hidden mb-6 rounded-2xl bg-[#151F32] p-6 text-center">

            <h2 id="affiche-ville" class="mb-4 text-xl font-semibold">
            </h2>

            <span id="weather-icon" class="text-5xl">☀️</span>

            <h3 id="temperature" class="my-3 text-5xl font-bold text-[#38BDF8]">
            </h3>

            <p id="weatherDes" class="text-gray-300">
            </p>

            <div class="mt-5 flex justify-around gap-4 text-sm text-[#94A3B8]">
                <p id="Humidite"></p>
                <p id="Vent"></p>
            </div>

        </section>

        <!-- Prévisions -->
        <section>

            <h2 class="mb-4 text-xl font-bold">
                Prévisions
            </h2>

            <div class="flex flex-col gap-3 sm:flex-row">

                <article class="flex-1 rounded-xl bg-[#151F32] p-5 text-center">
                    <h3>Lundi</h3>
                    <span class="my-3 block text-3xl">☀️</span>
                    <p>25°C</p>
                </article>

                <article class="flex-1 rounded-xl bg-[#151F32] p-5 text-center">
                    <h3>Mardi</h3>
                    <span class="my-3 block text-3xl">🌤️</span>
                    <p>22°C</p>
                </article>

                <article class="flex-1 rounded-xl bg-[#151F32] p-5 text-center">
                    <h3>Mercredi</h3>
                    <span class="my-3 block text-3xl">🌧️</span>
                    <p>19°C</p>
                </article>

            </div>

        </section>

    </main>

    <script type="module" src="./js/main.js"></script>

</body>
</html>
